name: Scrape and publish

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["*.py", ".github/workflows/scrape.yml"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape all sources
        run: python scraper.py -v

      - name: Commit updated data
        run: |
          git config user.name "quant-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.db docs/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh listings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
